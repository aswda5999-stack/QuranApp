name: Build & Auto-Sign QuranApp

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'daily_content.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Auto-Increment versionCode for Seamless Updates
        run: |
          NEW_CODE=$((100 + ${{ github.run_number }}))
          if [ -f "app/build.gradle.kts" ]; then
            sed -i "s/versionCode = [0-9]*/versionCode = $NEW_CODE/g" app/build/gradle.kts
            sed -i "s/versionName = \".*\"/versionName = \"1.0.$NEW_CODE\"/g" app/build/gradle.kts
          elif [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode [0-9]*/versionCode $NEW_CODE/g" app/build.gradle
            sed -i "s/versionName \".*\"/versionName \"1.0.$NEW_CODE\"/g" app/build.gradle
          fi

      - name: Ensure Permanent Keystore Exists
        run: |
          if [ ! -f "release.jks" ]; then
            keytool -genkeypair -v -keystore release.jks -alias quran_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=QuranApp, OU=Dev, O=Quran, L=Aleppo, S=Syria, C=SY"
          fi

      - name: Build & Sign APK (V1+V2+V3)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            gradle assembleRelease || gradle assembleDebug
          fi

          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$RAW_APK" aligned.apk

          $BUILD_TOOLS/apksigner sign \
            --ks release.jks \
            --ks-pass pass:123456 \
            --key-pass pass:123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out QuranApp-Release.apk \
            aligned.apk

          $BUILD_TOOLS/apksigner verify --verbose QuranApp-Release.apk

      - name: Publish Signed APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "القرآن الكريم - تحديث تلقائي #${{ github.run_number }}"
          body: "نسخة موقعة رسمياً (V1+V2+V3) تدعم التحديث المباشر فوق النسخة السابقة"
          files: QuranApp-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
