          @Composable
          fun MushafReaderScreen(initialPage: Int, onBack: () -> Unit) {
              val context = LocalContext.current
              val view = LocalView.current
              val settings by AppPreferences.settings.collectAsState()
              var favorites by remember { mutableStateOf(AppPreferences.getFavoritePages(context)) }
              var isZoomed by remember { mutableStateOf(false) }

              val pagerState = rememberPagerState(initialPage = (initialPage - 1).coerceIn(0, 603), pageCount = { 604 })
              val currentPage = pagerState.currentPage + 1
              val currentSurah = remember(currentPage) { QuranRepository.getSurahByPage(currentPage) }
              val currentJuz = remember(currentPage) { QuranRepository.getJuzByPage(currentPage) }
              val isBookmarked = favorites.contains(currentPage)

              LaunchedEffect(currentPage) { AppPreferences.updateLastRead(context, currentPage, currentSurah.name) }
              val nightInvertMatrix = remember { ColorMatrix(floatArrayOf(-1f, 0f, 0f, 0f, 255f, 0f, -1f, 0f, 0f, 255f, 0f, 0f, -1f, 0f, 255f, 0f, 0f, 0f, 1f, 0f)) }

              Column(modifier = Modifier.fillMaxSize().background(if (settings.nightMushafMode) Color(0xFF101714) else Color(0xFFF6EFE0))) {
                  Surface(color = EmeraldDark, shadowElevation = 4.dp) {
                      Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 6.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          IconButton(onClick = { AppPreferences.playTouchSound(view); onBack() }) { Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "رجوع", tint = Color.White) }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(currentSurah.name, color = GoldLight, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                              Text("الجزء $currentJuz • صفحة $currentPage من ٦٠٤", color = Color.White.copy(alpha = 0.85f), fontSize = 12.sp)
                          }
                          Row {
                              IconButton(onClick = { AppPreferences.playTouchSound(view); AppPreferences.setNightMushafMode(context, !settings.nightMushafMode) }) {
                                  Icon(if (settings.nightMushafMode) Icons.Default.LightMode else Icons.Default.DarkMode, contentDescription = "الوضع الليلي", tint = GoldLight)
                              }
                              IconButton(onClick = { AppPreferences.playTouchSound(view); favorites = AppPreferences.toggleFavoritePage(context, currentPage) }) {
                                  Icon(if (isBookmarked) Icons.Default.Bookmark else Icons.Outlined.BookmarkBorder, contentDescription = "حفظ", tint = if (isBookmarked) GoldAccent else Color.White)
                              }
                          }
                      }
                  }

                  HorizontalPager(state = pagerState, reverseLayout = true, modifier = Modifier.weight(1f).fillMaxWidth()) { pageIndex ->
                      val pageNumber = pageIndex + 1
                      Box(
                          modifier = Modifier.fillMaxSize().padding(horizontal = 6.dp, vertical = 4.dp).border(2.dp, GoldAccent.copy(alpha = 0.65f), RoundedCornerShape(8.dp)).clip(RoundedCornerShape(8.dp)).background(if (settings.nightMushafMode) Color.Black else Color(0xFFFFFDF7))
                              .pointerInput(Unit) { detectTapGestures(onDoubleTap = { AppPreferences.playTouchSound(view); isZoomed = !isZoomed }) },
                          contentAlignment = Alignment.Center
                      ) {
                          SubcomposeAsyncImage(
                              model = ImageRequest.Builder(context).data(QuranRepository.getMushafPageImageUrl(pageNumber)).crossfade(true).diskCachePolicy(CachePolicy.ENABLED).memoryCachePolicy(CachePolicy.ENABLED).build(),
                              contentDescription = "صفحة $pageNumber", contentScale = ContentScale.Fit,
                              colorFilter = if (settings.nightMushafMode) ColorFilter.colorMatrix(nightInvertMatrix) else null,
                              modifier = Modifier.fillMaxSize().graphicsLayer(scaleX = if (isZoomed) 1.35f else 1f, scaleY = if (isZoomed) 1.35f else 1f),
                              loading = {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      CircularProgressIndicator(color = GoldAccent)
                                      Spacer(modifier = Modifier.height(10.dp))
                                      Text("جاري تحميل صفحة $pageNumber من المصحف...", color = if (settings.nightMushafMode) Color.White else TextDark, fontSize = 13.sp)
                                  }
                              },
                              error = {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(24.dp)) {
                                      Icon(Icons.Default.WifiOff, contentDescription = null, tint = GoldAccent, modifier = Modifier.size(44.dp))
                                      Spacer(modifier = Modifier.height(8.dp))
                                      Text("تحتاج الصفحة $pageNumber للاتصال بالإنترنت لأول مرة فقط، وبعدها تُحفظ في هاتفك للأبد.", color = if (settings.nightMushafMode) Color.White else TextDark, textAlign = TextAlign.Center, fontSize = 14.sp)
                                  }
                              }
                          )
                      }
                  }

                  Surface(color = EmeraldDark) {
                      Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 6.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          Text("اسحب لليمين أو اليسار لتقليب الصفحات • انقر مرتين للتكبير", color = GoldLight.copy(alpha = 0.9f), fontSize = 11.sp)
                          Text("﴿ $currentPage ﴾", color = GoldAccent, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                      }
                  }
              }
          }
          @Composable
          fun AudioSurahsScreen(onBack: () -> Unit, onOpenAudioPlayer: (Int, String) -> Unit) {
              val context = LocalContext.current
              val view = LocalView.current
              val scope = rememberCoroutineScope()
              val settings by AppPreferences.settings.collectAsState()
              val downloadProgress by AudioDownloadManager.downloadProgress.collectAsState()

              var selectedReciterId by remember { mutableStateOf(settings.selectedReciterId) }
              var refreshTrigger by remember { mutableIntStateOf(0) }
              var searchQuery by remember { mutableStateOf("") }

              val currentReciter = remember(selectedReciterId) { QuranRepository.reciters.find { it.id == selectedReciterId } ?: QuranRepository.reciters.first() }
              val filteredSurahs = remember(searchQuery) {
                  if (searchQuery.isBlank()) QuranRepository.surahs else QuranRepository.surahs.filter { it.name.contains(searchQuery.trim()) }
              }

              Column(modifier = Modifier.fillMaxSize().background(IvoryBg)) {
                  Surface(color = EmeraldPrimary, shadowElevation = 4.dp) {
                      Column(modifier = Modifier.padding(14.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                              IconButton(onClick = { AppPreferences.playTouchSound(view); onBack() }) { Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "رجوع", tint = Color.White) }
                              Text("المشغل الصوتي المستقل", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.width(48.dp))
                          }
                          Spacer(modifier = Modifier.height(8.dp))
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(horizontal = 4.dp)) {
                              items(QuranRepository.reciters) { reciter ->
                                  val isSelected = reciter.id == selectedReciterId
                                  Card(
                                      modifier = Modifier.width(155.dp).clickable { AppPreferences.playTouchSound(view); selectedReciterId = reciter.id; AppPreferences.setSelectedReciter(context, reciter.id) },
                                      shape = RoundedCornerShape(14.dp), colors = CardDefaults.cardColors(containerColor = if (isSelected) GoldAccent else EmeraldDark.copy(alpha = 0.7f)), border = BorderStroke(1.dp, GoldLight)
                                  ) {
                                      Row(modifier = Modifier.padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                          SubcomposeAsyncImage(
                                              model = reciter.imageUrl, contentDescription = reciter.name, contentScale = ContentScale.Crop,
                                              modifier = Modifier.size(38.dp).clip(CircleShape).border(1.dp, Color.White, CircleShape),
                                              error = { Box(modifier = Modifier.fillMaxSize().background(EmeraldLight), contentAlignment = Alignment.Center) { Icon(Icons.Default.Person, contentDescription = null, tint = Color.White) } }
                                          )
                                          Spacer(modifier = Modifier.width(8.dp))
                                          Text(reciter.name, color = if (isSelected) EmeraldDark else Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold, maxLines = 2, overflow = TextOverflow.Ellipsis)
                                      }
                                  }
                              }
                          }
                          Spacer(modifier = Modifier.height(10.dp))
                          OutlinedTextField(
                              value = searchQuery, onValueChange = { searchQuery = it },
                              placeholder = { Text("ابحث عن السورة للاستماع أو التنزيل...", color = Color.White.copy(alpha = 0.7f), fontSize = 13.sp) },
                              leadingIcon = { Icon(Icons.Default.Search, contentDescription = null, tint = GoldLight) },
                              singleLine = true, modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(14.dp),
                              colors = OutlinedTextFieldDefaults.colors(focusedTextColor = Color.White, unfocusedTextColor = Color.White, focusedBorderColor = GoldAccent, unfocusedBorderColor = Color.White.copy(alpha = 0.4f))
                          )
                      }
                  }

                  LazyColumn(contentPadding = PaddingValues(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      items(filteredSurahs, key = { "${selectedReciterId}_${it.number}_$refreshTrigger" }) { surah ->
                          val taskKey = "${selectedReciterId}_${surah.number}"
                          val progress: Int? = downloadProgress[taskKey]
                          val isDownloaded = remember(selectedReciterId, surah.number, refreshTrigger, progress) { AudioDownloadManager.isSurahDownloaded(context, selectedReciterId, surah.number) }

                          Card(
                              modifier = Modifier.fillMaxWidth().clickable {
                                  AppPreferences.playTouchSound(view)
                                  if (isDownloaded) {
                                      val file = AudioDownloadManager.getLocalAudioFile(context, selectedReciterId, surah.number)
                                      QuranAudioService.startSurah(context, surah.number, surah.name, currentReciter.id, currentReciter.name, file.absolutePath)
                                      onOpenAudioPlayer(surah.number, currentReciter.id)
                                  } else if (progress == null) {
                                      scope.launch { if (AudioDownloadManager.downloadSurah(context, currentReciter, surah.number)) refreshTrigger++ }
                                  }
                              },
                              shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = CardCream),
                              border = BorderStroke(1.dp, if (isDownloaded) EmeraldLight.copy(alpha = 0.5f) else GoldAccent.copy(alpha = 0.35f))
                          ) {
                              Column(modifier = Modifier.padding(horizontal = 14.dp, vertical = 12.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Box(modifier = Modifier.size(40.dp).background(EmeraldPrimary, CircleShape), contentAlignment = Alignment.Center) {
                                              Text("${surah.number}", color = GoldLight, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                          }
                                          Spacer(modifier = Modifier.width(12.dp))
                                          Column {
                                              Text(surah.name, fontSize = 16.sp, fontWeight = FontWeight.Bold, color = TextDark)
                                              Text(if (isDownloaded) "محفوظة على الجهاز • تعمل بدون إنترنت" else "اضغط على السهم للتنزيل مرة واحدة", fontSize = 11.sp, color = if (isDownloaded) EmeraldPrimary else TextMuted)
                                          }
                                      }
                                      when {
                                          progress != null -> Surface(color = GoldLight.copy(alpha = 0.45f), shape = RoundedCornerShape(50)) {
                                              Text("$progress%", color = EmeraldDark, fontWeight = FontWeight.Bold, fontSize = 13.sp, modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp))
                                          }
                                          isDownloaded -> IconButton(
                                              onClick = {
                                                  AppPreferences.playTouchSound(view)
                                                  val file = AudioDownloadManager.getLocalAudioFile(context, selectedReciterId, surah.number)
                                                  QuranAudioService.startSurah(context, surah.number, surah.name, currentReciter.id, currentReciter.name, file.absolutePath)
                                                  onOpenAudioPlayer(surah.number, currentReciter.id)
                                              },
                                              modifier = Modifier.size(42.dp).background(EmeraldPrimary, CircleShape)
                                          ) { Icon(Icons.Default.PlayArrow, contentDescription = "تشغيل", tint = GoldAccent) }
                                          else -> IconButton(
                                              onClick = { AppPreferences.playTouchSound(view); scope.launch { if (AudioDownloadManager.downloadSurah(context, currentReciter, surah.number)) refreshTrigger++ } },
                                              modifier = Modifier.size(42.dp).background(GoldLight.copy(alpha = 0.45f), CircleShape).border(1.dp, GoldAccent, CircleShape)
                                          ) { Icon(Icons.Default.ArrowDownward, contentDescription = "تنزيل", tint = EmeraldDark) }
                                      }
                                  }
                                  if (progress != null) {
                                      Spacer(modifier = Modifier.height(8.dp))
                                      LinearProgressIndicator(progress = { progress / 100f }, modifier = Modifier.fillMaxWidth().height(6.dp).clip(CircleShape), color = EmeraldPrimary, trackColor = GoldLight)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AudioPlayerScreen(initialSurahNumber: Int, reciterId: String, onBack: () -> Unit) {
              val context = LocalContext.current
              val view = LocalView.current
              val scope = rememberCoroutineScope()
              val audioState by QuranAudioService.playbackState.collectAsState()
              val downloadProgress by AudioDownloadManager.downloadProgress.collectAsState()

              val activeSurahNumber = if (audioState.isPrepared) audioState.surahNumber else initialSurahNumber
              val activeReciter = remember(reciterId, audioState.reciterId) {
                  val targetId = if (audioState.isPrepared) audioState.reciterId else reciterId
                  QuranRepository.reciters.find { it.id == targetId } ?: QuranRepository.reciters.first()
              }
              val surahName = QuranRepository.getSurahNameByNumber(activeSurahNumber)
              val nextSurahNum = (activeSurahNumber + 1).coerceAtMost(114)
              val prevSurahNum = (activeSurahNumber - 1).coerceAtLeast(1)

              Column(
                  modifier = Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(EmeraldDark, EmeraldPrimary, Color(0xFF072D21)))).padding(20.dp),
                  horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                      IconButton(onClick = { AppPreferences.playTouchSound(view); onBack() }, modifier = Modifier.size(42.dp).background(Color.White.copy(alpha = 0.12f), CircleShape)) {
                          Icon(Icons.Default.KeyboardArrowDown, contentDescription = "تصغير", tint = Color.White)
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("المشغل الصوتي", color = GoldLight, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                          Text("يعمل في الخلفية وشريط الإشعارات", color = Color.White.copy(alpha = 0.7f), fontSize = 11.sp)
                      }
                      Spacer(modifier = Modifier.size(42.dp))
                  }

                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Box(modifier = Modifier.size(220.dp).shadow(16.dp, CircleShape).border(4.dp, GoldAccent, CircleShape).padding(6.dp).clip(CircleShape).background(EmeraldDark), contentAlignment = Alignment.Center) {
                          SubcomposeAsyncImage(model = activeReciter.imageUrl, contentDescription = activeReciter.name, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize(), error = { Icon(Icons.Default.Person, contentDescription = null, tint = GoldLight, modifier = Modifier.size(110.dp)) })
                      }
                      Spacer(modifier = Modifier.height(22.dp))
                      Text(surahName, color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(4.dp))
                      Text("الشيخ ${activeReciter.name}", color = GoldLight, fontSize = 16.sp, fontWeight = FontWeight.Medium)
                      Text(activeReciter.style, color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                  }

                  Column(modifier = Modifier.fillMaxWidth()) {
                      val duration = audioState.durationMs.coerceAtLeast(1L)
                      val position = audioState.currentPositionMs.coerceIn(0L, duration)
                      Slider(value = position.toFloat(), onValueChange = { QuranAudioService.sendCommand(context, QuranAudioService.ACTION_SEEK_TO, it.toLong()) }, valueRange = 0f..duration.toFloat(), colors = SliderDefaults.colors(thumbColor = GoldAccent, activeTrackColor = GoldAccent, inactiveTrackColor = Color.White.copy(alpha = 0.25f)))
                      Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 6.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(formatMillis(position), color = GoldLight, fontSize = 12.sp)
                          Text(formatMillis(duration), color = Color.White.copy(alpha = 0.8f), fontSize = 12.sp)
                      }
                      Spacer(modifier = Modifier.height(18.dp))
                      Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceEvenly) {
                          IconButton(onClick = {
                              AppPreferences.playTouchSound(view)
                              scope.launch {
                                  if (AudioDownloadManager.isSurahDownloaded(context, activeReciter.id, prevSurahNum) || AudioDownloadManager.downloadSurah(context, activeReciter, prevSurahNum)) {
                                      val file = AudioDownloadManager.getLocalAudioFile(context, activeReciter.id, prevSurahNum)
                                      QuranAudioService.startSurah(context, prevSurahNum, QuranRepository.getSurahNameByNumber(prevSurahNum), activeReciter.id, activeReciter.name, file.absolutePath)
                                  }
                              }
                          }, modifier = Modifier.size(50.dp).background(Color.White.copy(alpha = 0.12f), CircleShape)) { Icon(Icons.Default.SkipPrevious, contentDescription = "السابقة", tint = Color.White, modifier = Modifier.size(28.dp)) }

                          IconButton(onClick = { AppPreferences.playTouchSound(view); QuranAudioService.sendCommand(context, QuranAudioService.ACTION_SEEK_BY, -10_000L) }, modifier = Modifier.size(48.dp).background(Color.White.copy(alpha = 0.12f), CircleShape)) { Icon(Icons.Default.Replay10, contentDescription = "ترجيع", tint = GoldLight, modifier = Modifier.size(26.dp)) }

                          IconButton(onClick = {
                              AppPreferences.playTouchSound(view)
                              if (audioState.isPrepared) QuranAudioService.sendCommand(context, QuranAudioService.ACTION_TOGGLE_PLAY)
                              else if (AudioDownloadManager.isSurahDownloaded(context, activeReciter.id, activeSurahNumber)) {
                                  val file = AudioDownloadManager.getLocalAudioFile(context, activeReciter.id, activeSurahNumber)
                                  QuranAudioService.startSurah(context, activeSurahNumber, surahName, activeReciter.id, activeReciter.name, file.absolutePath)
                              }
                          }, modifier = Modifier.size(76.dp).shadow(12.dp, CircleShape).background(GoldAccent, CircleShape)) { Icon(if (audioState.isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow, contentDescription = "تشغيل", tint = EmeraldDark, modifier = Modifier.size(42.dp)) }

                          IconButton(onClick = { AppPreferences.playTouchSound(view); QuranAudioService.sendCommand(context, QuranAudioService.ACTION_SEEK_BY, 10_000L) }, modifier = Modifier.size(48.dp).background(Color.White.copy(alpha = 0.12f), CircleShape)) { Icon(Icons.Default.Forward10, contentDescription = "تقديم", tint = GoldLight, modifier = Modifier.size(26.dp)) }

                          IconButton(onClick = {
                              AppPreferences.playTouchSound(view)
                              scope.launch {
                                  if (AudioDownloadManager.isSurahDownloaded(context, activeReciter.id, nextSurahNum) || AudioDownloadManager.downloadSurah(context, activeReciter, nextSurahNum)) {
                                      val file = AudioDownloadManager.getLocalAudioFile(context, activeReciter.id, nextSurahNum)
                                      QuranAudioService.startSurah(context, nextSurahNum, QuranRepository.getSurahNameByNumber(nextSurahNum), activeReciter.id, activeReciter.name, file.absolutePath)
                                  }
                              }
                          }, modifier = Modifier.size(50.dp).background(Color.White.copy(alpha = 0.12f), CircleShape)) { Icon(Icons.Default.SkipNext, contentDescription = "التالية", tint = Color.White, modifier = Modifier.size(28.dp)) }
                      }
                      downloadProgress.values.firstOrNull()?.let { pct ->
                          Spacer(modifier = Modifier.height(12.dp))
                          Text("جاري تنزيل السورة: $pct%", color = GoldLight, fontSize = 12.sp, modifier = Modifier.align(Alignment.CenterHorizontally))
                      }
                  }
              }
          }

          @Composable
          fun HadithScreen(onBack: () -> Unit) {
              val context = LocalContext.current
              val view = LocalView.current
              Column(modifier = Modifier.fillMaxSize().background(IvoryBg)) {
                  Surface(color = EmeraldPrimary, shadowElevation = 4.dp) {
                      Row(modifier = Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          IconButton(onClick = { AppPreferences.playTouchSound(view); onBack() }) { Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "رجوع", tint = Color.White) }
                          Text("الأحاديث النبوية الشريفة", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.width(48.dp))
                      }
                  }
