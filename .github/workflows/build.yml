name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Wipe Old Sources & Generate Clean Project
        run: |
          rm -rf app/src/main/java/com/quran/app
          mkdir -p app/src/main/java/com/quran/app
          python3 - << 'PYEOF'
          base = "app/src/main/java/com/quran/app"

          app_data = """package com.quran.app

          import android.content.Context
          import android.view.SoundEffectConstants
          import android.view.View
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          data class SurahInfo(val number: Int, val name: String, val type: String, val ayahCount: Int, val startPage: Int)
          data class ReciterInfo(val id: String, val name: String, val style: String, val audioBaseUrl: String, val imageUrl: String)
          data class HadithItem(val id: Int, val title: String, val text: String, val narrator: String, val source: String, val explanation: String)
          data class DhikrItem(val id: Int, val category: String, val text: String, val targetCount: Int, val reward: String)

          data class AppSettingsState(
              val touchSoundEnabled: Boolean = true,
              val vibrationEnabled: Boolean = true,
              val nightMushafMode: Boolean = false,
              val keepScreenOn: Boolean = true,
              val lastReadPage: Int = 1,
              val lastReadSurahName: String = "سورة الفاتحة",
              val selectedReciterId: String = "afs",
              val totalTasbihCount: Int = 0
          )

          object AppPreferences {
              private const val PREFS_NAME = "quran_app_v3_prefs"
              private val _settings = MutableStateFlow(AppSettingsState())
              val settings: StateFlow<AppSettingsState> = _settings.asStateFlow()

              fun init(context: Context) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  _settings.value = AppSettingsState(
                      touchSoundEnabled = prefs.getBoolean("touch_sound", true),
                      vibrationEnabled = prefs.getBoolean("vibration", true),
                      nightMushafMode = prefs.getBoolean("night_mushaf", false),
                      keepScreenOn = prefs.getBoolean("keep_screen_on", true),
                      lastReadPage = prefs.getInt("last_read_page", 1).coerceIn(1, 604),
                      lastReadSurahName = prefs.getString("last_read_surah", "سورة الفاتحة") ?: "سورة الفاتحة",
                      selectedReciterId = prefs.getString("selected_reciter", "afs") ?: "afs",
                      totalTasbihCount = prefs.getInt("total_tasbih", 0)
                  )
              }

              fun playTouchSound(view: View?) {
                  if (_settings.value.touchSoundEnabled) view?.playSoundEffect(SoundEffectConstants.CLICK)
              }

              fun setTouchSound(context: Context, enabled: Boolean) {
                  _settings.value = _settings.value.copy(touchSoundEnabled = enabled)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putBoolean("touch_sound", enabled).apply()
              }

              fun setVibration(context: Context, enabled: Boolean) {
                  _settings.value = _settings.value.copy(vibrationEnabled = enabled)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putBoolean("vibration", enabled).apply()
              }

              fun setNightMushafMode(context: Context, enabled: Boolean) {
                  _settings.value = _settings.value.copy(nightMushafMode = enabled)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putBoolean("night_mushaf", enabled).apply()
              }

              fun setKeepScreenOn(context: Context, enabled: Boolean) {
                  _settings.value = _settings.value.copy(keepScreenOn = enabled)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putBoolean("keep_screen_on", enabled).apply()
              }

              fun updateLastRead(context: Context, page: Int, surahName: String) {
                  val safePage = page.coerceIn(1, 604)
                  _settings.value = _settings.value.copy(lastReadPage = safePage, lastReadSurahName = surahName)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putInt("last_read_page", safePage).putString("last_read_surah", surahName).apply()
              }

              fun setSelectedReciter(context: Context, reciterId: String) {
                  _settings.value = _settings.value.copy(selectedReciterId = reciterId)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putString("selected_reciter", reciterId).apply()
              }

              fun incrementTotalTasbih(context: Context) {
                  val updated = _settings.value.totalTasbihCount + 1
                  _settings.value = _settings.value.copy(totalTasbihCount = updated)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putInt("total_tasbih", updated).apply()
              }

              fun getFavoritePages(context: Context): Set<Int> {
                  val raw = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).getStringSet("favorite_pages", emptySet()) ?: emptySet()
                  return raw.mapNotNull { it.toIntOrNull() }.toSet()
              }

              fun toggleFavoritePage(context: Context, page: Int): Set<Int> {
                  val current = getFavoritePages(context).toMutableSet()
                  if (current.contains(page)) current.remove(page) else current.add(page)
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE).edit().putStringSet("favorite_pages", current.map { it.toString() }.toSet()).apply()
                  return current
              }
          }

          object AudioDownloadManager {
              private val _downloadProgress = MutableStateFlow>(emptyMap())
              val downloadProgress: StateFlow> = _downloadProgress.asStateFlow()

              private fun key(reciterId: String, surahNumber: Int): String = "${reciterId}_$surahNumber"

              fun getLocalAudioFile(context: Context, reciterId: String, surahNumber: Int): File {
                  val dir = File(context.filesDir, "quran_audio/$reciterId")
                  if (!dir.exists()) dir.mkdirs()
                  return File(dir, "${surahNumber.toString().padStart(3, '0')}.mp3")
              }

              fun isSurahDownloaded(context: Context, reciterId: String, surahNumber: Int): Boolean {
                  val file = getLocalAudioFile(context, reciterId, surahNumber)
                  return file.exists() && file.length() > 2048L
              }

              fun getDownloadedCount(context: Context, reciterId: String): Int {
                  val dir = File(context.filesDir, "quran_audio/$reciterId")
                  return if (!dir.exists()) 0 else dir.listFiles()?.count { it.extension == "mp3" && it.length() > 2048L } ?: 0
              }

              suspend fun downloadSurah(context: Context, reciter: ReciterInfo, surahNumber: Int): Boolean = withContext(Dispatchers.IO) {
                  val taskKey = key(reciter.id, surahNumber)
                  if (_downloadProgress.value.containsKey(taskKey)) return@withContext false
                  val targetFile = getLocalAudioFile(context, reciter.id, surahNumber)
                  val tempFile = File(targetFile.parentFile, "${targetFile.name}.tmp")
                  val urlString = "${reciter.audioBaseUrl}/${surahNumber.toString().padStart(3, '0')}.mp3"
                  try {
                      _downloadProgress.value = _downloadProgress.value + (taskKey to 1)
                      val conn = (URL(urlString).openConnection() as HttpURLConnection).apply {
                          connectTimeout = 15000; readTimeout = 20000; instanceFollowRedirects = true; connect()
                      }
                      if (conn.responseCode !in 200..299) {
                          _downloadProgress.value = _downloadProgress.value - taskKey
                          return@withContext false
                      }
                      val totalBytes = conn.contentLength.toLong()
                      conn.inputStream.use { input ->
                          FileOutputStream(tempFile).use { output ->
                              val buffer = ByteArray(8192)
                              var copied = 0L
                              var read: Int
                              while (input.read(buffer).also { read = it } != -1) {
                                  output.write(buffer, 0, read)
                                  copied += read
                                  val pct = if (totalBytes > 0L) ((copied * 100L) / totalBytes).toInt().coerceIn(1, 99) else 50
                                  _downloadProgress.value = _downloadProgress.value + (taskKey to pct)
                              }
                          }
                      }
                      if (tempFile.exists() && tempFile.length() > 2048L) {
                          if (targetFile.exists()) targetFile.delete()
                          tempFile.renameTo(targetFile)
                          _downloadProgress.value = _downloadProgress.value - taskKey
                          return@withContext true
                      }
                  } catch (_: Exception) { }
                  tempFile.delete()
                  _downloadProgress.value = _downloadProgress.value - taskKey
                  false
              }
          }

