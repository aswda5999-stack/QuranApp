          audio_service = """package com.quran.app

          import android.app.*
          import android.content.*
          import android.media.*
          import android.os.*
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.*
          import java.io.File

          data class AudioPlaybackState(
              val isPrepared: Boolean = false, val isPlaying: Boolean = false, val surahNumber: Int = 1,
              val surahName: String = "سورة الفاتحة", val reciterId: String = "afs",
              val reciterName: String = "مشاري راشد العفاسي", val currentPositionMs: Long = 0L, val durationMs: Long = 1L
          )

          class QuranAudioService : Service() {
              companion object {
                  const val CHANNEL_ID = "quran_audio_playback_channel"
                  const val NOTIFICATION_ID = 3030
                  const val ACTION_PLAY_FILE = "com.quran.app.ACTION_PLAY_FILE"
                  const val ACTION_TOGGLE_PLAY = "com.quran.app.ACTION_TOGGLE_PLAY"
                  const val ACTION_SEEK_TO = "com.quran.app.ACTION_SEEK_TO"
                  const val ACTION_SEEK_BY = "com.quran.app.ACTION_SEEK_BY"
                  const val ACTION_STOP = "com.quran.app.ACTION_STOP"
                  const val EXTRA_SURAH_NUM = "extra_surah_num"
                  const val EXTRA_SURAH_NAME = "extra_surah_name"
                  const val EXTRA_RECITER_ID = "extra_reciter_id"
                  const val EXTRA_RECITER_NAME = "extra_reciter_name"
                  const val EXTRA_FILE_PATH = "extra_file_path"
                  const val EXTRA_SEEK_VAL = "extra_seek_val"

                  private val _playbackState = MutableStateFlow(AudioPlaybackState())
                  val playbackState: StateFlow<AudioPlaybackState> = _playbackState.asStateFlow()

                  fun startSurah(context: Context, surahNumber: Int, surahName: String, reciterId: String, reciterName: String, filePath: String) {
                      val intent = Intent(context, QuranAudioService::class.java).apply {
                          action = ACTION_PLAY_FILE
                          putExtra(EXTRA_SURAH_NUM, surahNumber); putExtra(EXTRA_SURAH_NAME, surahName)
                          putExtra(EXTRA_RECITER_ID, reciterId); putExtra(EXTRA_RECITER_NAME, reciterName)
                          putExtra(EXTRA_FILE_PATH, filePath)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(intent) else context.startService(intent)
                  }

                  fun sendCommand(context: Context, action: String, seekValue: Long = 0L) {
                      context.startService(Intent(context, QuranAudioService::class.java).apply { this.action = action; putExtra(EXTRA_SEEK_VAL, seekValue) })
                  }
              }

              private var mediaPlayer: MediaPlayer? = null
              private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private var progressJob: Job? = null

              override fun onCreate() { super.onCreate(); createNotificationChannel() }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_PLAY_FILE -> playLocalFile(
                          intent.getIntExtra(EXTRA_SURAH_NUM, 1), intent.getStringExtra(EXTRA_SURAH_NAME) ?: "سورة الفاتحة",
                          intent.getStringExtra(EXTRA_RECITER_ID) ?: "afs", intent.getStringExtra(EXTRA_RECITER_NAME) ?: "مشاري راشد العفاسي",
                          intent.getStringExtra(EXTRA_FILE_PATH) ?: ""
                      )
                      ACTION_TOGGLE_PLAY -> mediaPlayer?.let { mp ->
                          if (mp.isPlaying) mp.pause() else mp.start()
                          _playbackState.value = _playbackState.value.copy(isPlaying = mp.isPlaying)
                          updateNotification()
                      }
                      ACTION_SEEK_TO -> mediaPlayer?.let { mp ->
                          mp.seekTo(intent.getLongExtra(EXTRA_SEEK_VAL, 0L).toInt().coerceIn(0, mp.duration.coerceAtLeast(1)))
                          _playbackState.value = _playbackState.value.copy(currentPositionMs = mp.currentPosition.toLong())
                      }
                      ACTION_SEEK_BY -> mediaPlayer?.let { mp ->
                          mp.seekTo((mp.currentPosition + intent.getLongExtra(EXTRA_SEEK_VAL, 0L).toInt()).coerceIn(0, mp.duration.coerceAtLeast(1)))
                          _playbackState.value = _playbackState.value.copy(currentPositionMs = mp.currentPosition.toLong())
                      }
                      ACTION_STOP -> stopPlaybackAndService()
                  }
                  return START_NOT_STICKY
              }

              private fun playLocalFile(surahNum: Int, surahName: String, reciterId: String, reciterName: String, filePath: String) {
                  val file = File(filePath)
                  if (!file.exists()) return
                  try {
                      mediaPlayer?.release()
                      mediaPlayer = MediaPlayer().apply {
                          setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).setUsage(AudioAttributes.USAGE_MEDIA).build())
                          setDataSource(file.absolutePath); prepare(); start()
                          setOnCompletionListener { _playbackState.value = _playbackState.value.copy(isPlaying = false, currentPositionMs = 0L); updateNotification() }
                      }
                      val dur = (mediaPlayer?.duration ?: 1).toLong().coerceAtLeast(1L)
                      _playbackState.value = AudioPlaybackState(true, true, surahNum, surahName, reciterId, reciterName, 0L, dur)
                      startForeground(NOTIFICATION_ID, buildNotification())
                      progressJob?.cancel()
                      progressJob = serviceScope.launch {
                          while (isActive) {
                              mediaPlayer?.let { mp -> if (mp.isPlaying) _playbackState.value = _playbackState.value.copy(currentPositionMs = mp.currentPosition.toLong(), durationMs = mp.duration.toLong().coerceAtLeast(1L)) }
                              delay(500L)
                          }
                      }
                  } catch (e: Exception) { e.printStackTrace() }
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getSystemService(NotificationManager::class.java).createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "تلاوات القرآن الكريم", NotificationManager.IMPORTANCE_LOW).apply { setShowBadge(false) }
                      )
                  }
              }

              private fun buildNotification(): Notification {
                  val state = _playbackState.value
                  val openIntent = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val toggleIntent = PendingIntent.getService(this, 1, Intent(this, QuranAudioService::class.java).apply { action = ACTION_TOGGLE_PLAY }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val stopIntent = PendingIntent.getService(this, 2, Intent(this, QuranAudioService::class.java).apply { action = ACTION_STOP }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentTitle(state.surahName).setContentText("الشيخ ${state.reciterName}")
                      .setContentIntent(openIntent).setOngoing(state.isPlaying).setOnlyAlertOnce(true)
                      .addAction(if (state.isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play, if (state.isPlaying) "إيقاف" else "تشغيل", toggleIntent)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إغلاق", stopIntent).build()
              }
