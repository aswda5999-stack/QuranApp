name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-Fix Screens.kt Syntax
        run: |
          python3 -c '
          p = "app/src/main/java/com/quran/app/Screens.kt"
          txt = open(p, encoding="utf-8").read()
          txt = txt.replace("shareText(context, \"${hadith.title}\\n\\n${hadith.text}\\n\\nالراوي: ${hadith.narrator} (${hadith.source})\") })", "shareText(context, \"${hadith.title}\\n\\n${hadith.text}\\n\\nالراوي: ${hadith.narrator} (${hadith.source})\") })")
          open(p, "w", encoding="utf-8").write(txt)
          '

      - name: Generate Persistent Keystore
        run: |
          mkdir -p app
          keytool -genkeypair -v -keystore app/release.jks -alias quran_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=QuranApp, OU=Dev, O=Quran, L=Aleppo, S=Syria, C=SY"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
