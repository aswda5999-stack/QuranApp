                          is AppRoute.SurahIndex -> SurahIndexScreen(onBack = { currentRoute = AppRoute.Home }, onOpenMushafPage = { currentRoute = AppRoute.MushafPage(it) })
                          is AppRoute.MushafPage -> MushafReaderScreen(initialPage = route.initialPage, onBack = { currentRoute = AppRoute.SurahIndex })
                          is AppRoute.AudioSurahs -> AudioSurahsScreen(onBack = { currentRoute = AppRoute.Home }, onOpenAudioPlayer = { s, r -> currentRoute = AppRoute.AudioPlayer(s, r) })
                          is AppRoute.AudioPlayer -> AudioPlayerScreen(initialSurahNumber = route.surahNumber, reciterId = route.reciterId, onBack = { currentRoute = AppRoute.AudioSurahs })
                          is AppRoute.Hadith -> HadithScreen(onBack = { currentRoute = AppRoute.Home })
                          is AppRoute.AdhkarTasbih -> AdhkarAndTasbihScreen(onBack = { currentRoute = AppRoute.Home })
                          is AppRoute.Favorites -> FavoritesScreen(onBack = { currentRoute = AppRoute.Home }, onOpenPage = { currentRoute = AppRoute.MushafPage(it) })
                          is AppRoute.Settings -> SettingsScreen(onBack = { currentRoute = AppRoute.Home })
                      }
                  }
              }
          }
          """

          open(f"{base}/AppData.kt", "w", encoding="utf-8").write(app_data.strip() + "\n")
          open(f"{base}/QuranAudioService.kt", "w", encoding="utf-8").write(audio_service.strip() + "\n")
          open(f"{base}/Screens.kt", "w", encoding="utf-8").write(screens.strip() + "\n")
          open(f"{base}/MainActivity.kt", "w", encoding="utf-8").write(main_act.strip() + "\n")
          PYEOF

