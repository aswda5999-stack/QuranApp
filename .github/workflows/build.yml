name: Build & Sign QuranApp APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-increment versionCode
        run: |
          BUILD_NUM=$((200 + GITHUB_RUN_NUMBER))
          echo "Setting versionCode to $BUILD_NUM"
          if [ -f "app/build.gradle.kts" ]; then
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = $BUILD_NUM/g" app/build.gradle.kts
            sed -i -E "s/versionName\s*=\s*\"[^\"]+\"/versionName = \"2.$GITHUB_RUN_NUMBER\"/g" app/build.gradle.kts
          elif [ -f "app/build.gradle" ]; then
            sed -i -E "s/versionCode\s+[0-9]+/versionCode $BUILD_NUM/g" app/build.gradle
            sed -i -E "s/versionName\s+\"[^\"]+\"/versionName \"2.$GITHUB_RUN_NUMBER\"/g" app/build.gradle
          fi

      - name: Ensure Permanent Keystore Exists
        run: |
          mkdir -p signing
          if [ ! -f "signing/quran_release.jks" ]; then
            keytool -genkeypair -v \
              -keystore signing/quran_release.jks \
              -alias quran_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass QuranApp2026! \
              -keypass QuranApp2026! \
              -dname "CN=QuranApp, OU=Mobile, O=QuranApp, L=Mecca, C=SA"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f signing/quran_release.jks
            git commit -m "chore: save permanent release keystore [skip ci]" || true
            git push || true
          fi

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align, Sign (V1+V2+V3) & Verify APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"

          "$BUILD_TOOLS_DIR/zipalign" -v -p -f 4 "$RAW_APK" aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks signing/quran_release.jks \
            --ks-key-alias quran_key \
            --ks-pass pass:QuranApp2026! \
            --key-pass pass:QuranApp2026! \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out QuranApp-Release.apk \
            aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose QuranApp-Release.apk

      - name: Publish Signed APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-release
          name: "QuranApp - أحدث نسخة موقعة (بناء #${{ github.run_number }})"
          body: "نسخة موقعة رسمياً (V1+V2+V3) وجاهزة للتثبيت المباشر."
          files: QuranApp-Release.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
