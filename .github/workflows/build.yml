          private fun formatMillis(ms: Long): String {
              val totalSeconds = (ms / 1000L).coerceAtLeast(0L)
              val hours = totalSeconds / 3600
              val minutes = (totalSeconds % 3600) / 60
              val seconds = totalSeconds % 60
              return if (hours > 0) String.format("%d:%02d:%02d", hours, minutes, seconds) else String.format("%02d:%02d", minutes, seconds)
          }

          private fun shareText(context: Context, text: String) {
              context.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, text) }, "مشاركة عبر"))
          }

          private fun triggerVibration(context: Context, durationMs: Long) {
              try {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) (context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  else @Suppress("DEPRECATION") (context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(durationMs)
              } catch (_: Exception) { }
          }
