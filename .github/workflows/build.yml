                      Spacer(modifier = Modifier.width(12.dp))
                      Column { Text(title, fontWeight = FontWeight.Bold, fontSize = 15.sp, color = TextDark); Text(subtitle, fontSize = 12.sp, color = TextMuted) }
                  }
                  Switch(checked = checked, onCheckedChange = onCheckedChange, colors = SwitchDefaults.colors(checkedThumbColor = GoldLight, checkedTrackColor = EmeraldPrimary))
              }
