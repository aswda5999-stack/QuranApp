name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Complete Truncated Screens.kt Automatically
        run: |
          python3 - << 'PY'
          p = "app/src/main/java/com/quran/app/Screens.kt"
          txt = open(p, encoding="utf-8").read()
          cut = txt.rfind("item {")
          if cut != -1 and "fun formatMillis" not in txt:
              txt = txt[:cut] + """item { Card(shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = CardCream)) { Text("v3.0", modifier = Modifier.padding(16.dp), fontWeight = FontWeight.Bold) } } } } }

          @Composable
          private fun SettingSwitchRow(title: String, subtitle: String, icon: ImageVector, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              Row(modifier = Modifier.fillMaxWidth().clickable { onCheckedChange(!checked) }.padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                  Column(modifier = Modifier.weight(1f)) { Text(title, fontWeight = FontWeight.Bold, color = TextDark); Text(subtitle, fontSize = 12.sp, color = TextMuted) }
                  Switch(checked = checked, onCheckedChange = onCheckedChange)
              }
          }

          private fun formatMillis(ms: Long): String {
              val s = (ms / 1000L).coerceAtLeast(0L)
              return String.format("%02d:%02d", s / 60, s % 60)
          }

          private fun shareText(context: Context, text: String) {
              context.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, text) }, "مشاركة"))
          }

          private fun triggerVibration(context: Context, durationMs: Long) {
              try {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) (context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  else @Suppress("DEPRECATION") (context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator).vibrate(durationMs)
              } catch (_: Exception) { }
          }
          """
              open(p, "w", encoding="utf-8").write(txt)
          PY

      - name: Generate Persistent Keystore
        run: |
          mkdir -p app
          keytool -genkeypair -v -keystore app/release.jks -alias quran_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=QuranApp, OU=Dev, O=Quran, L=Aleppo, S=Syria, C=SY"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
