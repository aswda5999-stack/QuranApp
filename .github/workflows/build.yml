name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Fix Missing Helper Functions in Screens.kt
        run: |
          python3 -c '
          p = "app/src/main/java/com/quran/app/Screens.kt"
          txt = open(p, encoding="utf-8").read()
          if "fun formatMillis" not in txt:
              idx = txt.rfind("item {")
              if idx != -1:
                  txt = txt[:idx]
              tail = """
                      item {
                          Card(shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = CardCream), border = BorderStroke(1.dp, GoldAccent.copy(alpha = 0.4f))) {
                              Row(modifier = Modifier.fillMaxWidth().padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column {
                                      Text("القرآن الكريم - الإصدار الاحترافي", fontWeight = FontWeight.Bold, color = TextDark)
                                      Text("مصحف المدينة المنورة • تلاوات وأحاديث وأذكار", fontSize = 12.sp, color = TextMuted)
                                  }
                                  Surface(color = EmeraldPrimary, shape = RoundedCornerShape(10.dp)) {
                                      Text("v3.0", color = GoldLight, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SettingSwitchRow(title: String, subtitle: String, icon: ImageVector, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {
              Row(
                  modifier = Modifier.fillMaxWidth().clickable { onCheckedChange(!checked) }.padding(horizontal = 16.dp, vertical = 14.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  Row(modifier = Modifier.weight(1f), verticalAlignment = Alignment.CenterVertically) {
                      Box(modifier = Modifier.size(40.dp).background(IvoryBg, CircleShape), contentAlignment = Alignment.Center) {
                          Icon(icon, contentDescription = null, tint = EmeraldPrimary)
                      }
                      Spacer(modifier = Modifier.width(12.dp))
                      Column {
                          Text(title, fontWeight = FontWeight.Bold, fontSize = 15.sp, color = TextDark)
                          Text(subtitle, fontSize = 12.sp, color = TextMuted)
                      }
                  }
                  Switch(checked = checked, onCheckedChange = onCheckedChange, colors = SwitchDefaults.colors(checkedThumbColor = GoldLight, checkedTrackColor = EmeraldPrimary))
              }
          }

          private fun formatMillis(ms: Long): String {
              val totalSeconds = (ms / 1000L).coerceAtLeast(0L)
              val hours = totalSeconds / 3600
              val minutes = (totalSeconds % 3600) / 60
              val seconds = totalSeconds % 60
              return if (hours > 0) String.format("%d:%02d:%02d", hours, minutes, seconds) else String.format("%02d:%02d", minutes, seconds)
          }

          private fun shareText(context: Context, text: String) {
              val intent = Intent(Intent.ACTION_SEND).apply {
                  type = "text/plain"
                  putExtra(Intent.EXTRA_TEXT, text)
              }
              context.startActivity(Intent.createChooser(intent, "مشاركة عبر"))
          }

          private fun triggerVibration(context: Context, durationMs: Long) {
              try {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val manager = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      manager.defaultVibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator.vibrate(durationMs)
                      }
                  }
              } catch (_: Exception) { }
          }
          """
              open(p, "w", encoding="utf-8").write(txt + tail)
          '

      - name: Generate Persistent Keystore
        run: |
          mkdir -p app
          keytool -genkeypair -v -keystore app/release.jks -alias quran_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=QuranApp, OU=Dev, O=Quran, L=Aleppo, S=Syria, C=SY"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
